<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="primaryTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="lightGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur" />
    </filter>
  </defs>

  <style>
    .grid-line { stroke: #1e293b; stroke-width: 0.6; stroke-dasharray: 4, 8; opacity: 0.7; }
    .data-wire { stroke: #38bdf8; stroke-width: 1.5; stroke-dasharray: 6, 12; fill: none; opacity: 0.45; animation: dashMove 14s linear infinite; }
    .pulse-ring { transform-origin: center; animation: pulseScale 3.5s ease-in-out infinite; }
    .floating-orb { animation: floatOrb 8s ease-in-out infinite alternate; }
    .pill-card { rx: 16; ry: 16; fill: #1e293b; stroke: #334155; stroke-width: 1.2; fill-opacity: 0.85; }

    @keyframes dashMove {
      to { stroke-dashoffset: -180; }
    }
    @keyframes pulseScale {
      0%, 100% { transform: scale(1); opacity: 0.35; }
      50% { transform: scale(1.15); opacity: 0.8; }
    }
    @keyframes floatOrb {
      0% { transform: translateY(0px) translateX(0px); }
      100% { transform: translateY(-18px) translateX(12px); }
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Ambient Glowing Background Orbs -->
  <circle cx="150" cy="80" r="130" fill="#38bdf8" filter="url(#lightGlow)" opacity="0.12" class="floating-orb" />
  <circle cx="1080" cy="340" r="160" fill="#c084fc" filter="url(#lightGlow)" opacity="0.1" class="floating-orb" style="animation-duration: 11s;" />
  <circle cx="950" cy="90" r="110" fill="#818cf8" filter="url(#lightGlow)" opacity="0.14" class="floating-orb" style="animation-duration: 9s;" />

  <!-- Dynamic Background Grid -->
  <g class="grid-line">
    <line x1="80" y1="0" x2="80" y2="420" />
    <line x1="240" y1="0" x2="240" y2="420" />
    <line x1="400" y1="0" x2="400" y2="420" />
    <line x1="560" y1="0" x2="560" y2="420" />
    <line x1="720" y1="0" x2="720" y2="420" />
    <line x1="880" y1="0" x2="880" y2="420" />
    <line x1="1040" y1="0" x2="1040" y2="420" />
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
  </g>

  <!-- Dynamic Flow Wires (Master Data Sync Channels) -->
  <path d="M 60,370 C 260,330 380,390 600,360 S 880,310 1140,360" class="data-wire" stroke="#38bdf8" />
  <path d="M 40,60 C 320,110 500,30 760,80 S 980,140 1160,80" class="data-wire" stroke="#c084fc" style="animation-duration: 20s;" />
  <path d="M 120,200 C 300,260 480,160 740,240 S 940,180 1120,220" class="data-wire" stroke="#818cf8" style="animation-duration: 16s;" />

  <!-- Animated Master Data Golden Record Hub Nodes in Background/Flanks -->
  <g transform="translate(100, 290)">
    <circle cx="0" cy="0" r="32" fill="#38bdf8" opacity="0.15" class="pulse-ring" />
    <circle cx="0" cy="0" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <circle cx="0" cy="0" r="5" fill="#38bdf8" filter="url(#glow)" />
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle" font-weight="600">ERP / CRM</text>
  </g>

  <g transform="translate(1090, 160)">
    <circle cx="0" cy="0" r="36" fill="#c084fc" opacity="0.15" class="pulse-ring" style="animation-delay: 1.5s;" />
    <circle cx="0" cy="0" r="15" fill="#0f172a" stroke="#c084fc" stroke-width="2" />
    <circle cx="0" cy="0" r="5" fill="#c084fc" filter="url(#glow)" />
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle" font-weight="600">CLM / LEGAL</text>
  </g>

  <!-- FOREGROUND HERO CONTENT (Guaranteed Crisp & High Visibility) -->
  <!-- Top Category Tag -->
  <g transform="translate(600, 75)">
    <rect x="-185" y="-16" width="370" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" opacity="0.9" />
    <circle cx="-160" cy="0" r="4.5" fill="#22c55e" filter="url(#glow)" />
    <text x="-145" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#a5b4fc" font-weight="700" letter-spacing="1.5">ENTERPRISE DATA GOVERNANCE &amp; MDM</text>
  </g>

  <!-- Main Hero Title -->
  <text x="600" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="46" font-weight="900" fill="url(#primaryTextGrad)" text-anchor="middle" letter-spacing="-0.8">
    Contract Master Data Management
  </text>

  <!-- Subtitle Tagline -->
  <text x="600" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="18" font-weight="500" fill="#e2e8f0" text-anchor="middle" letter-spacing="0.2">
    Golden Records • Entity Resolution • Cross-System Consistency • Data Stewardship
  </text>

  <!-- Supporting Context Text -->
  <text x="600" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400" fill="#94a3b8" text-anchor="middle">
    The Curated Index of SaaS Platforms &amp; Open-Source Projects for Unified Contract Data
  </text>

  <!-- Feature Pills Row (Foreground Dynamic Cards) -->
  <g transform="translate(600, 310)">
    <!-- Pill 1: Golden Records -->
    <g transform="translate(-390, 0)">
      <rect x="-85" y="-20" width="170" height="40" class="pill-card" />
      <circle cx="-62" cy="0" r="4" fill="#38bdf8" />
      <text x="-48" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">Golden Records</text>
    </g>

    <!-- Pill 2: Entity Resolution -->
    <g transform="translate(-195, 0)">
      <rect x="-85" y="-20" width="170" height="40" class="pill-card" />
      <circle cx="-62" cy="0" r="4" fill="#818cf8" />
      <text x="-48" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">Entity Resolution</text>
    </g>

    <!-- Pill 3: Match & Merge -->
    <g transform="translate(0, 0)">
      <rect x="-85" y="-20" width="170" height="40" class="pill-card" />
      <circle cx="-62" cy="0" r="4" fill="#c084fc" />
      <text x="-48" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">Match &amp; Merge</text>
    </g>

    <!-- Pill 4: Data Quality & Lineage -->
    <g transform="translate(195, 0)">
      <rect x="-85" y="-20" width="170" height="40" class="pill-card" />
      <circle cx="-62" cy="0" r="4" fill="#34d399" />
      <text x="-48" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">Data Lineage</text>
    </g>

    <!-- Pill 5: Vendor Governance -->
    <g transform="translate(390, 0)">
      <rect x="-85" y="-20" width="170" height="40" class="pill-card" />
      <circle cx="-62" cy="0" r="4" fill="#fbbf24" />
      <text x="-48" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">Vendor Hierarchy</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="416" width="1200" height="4" fill="url(#primaryTextGrad)" />
</svg>
